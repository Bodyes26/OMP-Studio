[package]
name = "omp-studio-app"
version = "1.4.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "omp_studio_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
portable-pty = "0.9.0"
tokio = { version = "1.53.1", features = ["full"] }
parking_lot = "0.12.5"
notify = "8.2.0"
rusqlite = { version = "0.40.1", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "stream"] }
semver = "1.0"
futures-util = "0.3"
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect"] }
# Riassemblaggio dei frame `rpc_chunk` del protocollo v2: il payload dei
# chunk e' base64 e va decodificato in Rust, non nel webview.
base64 = "0.22"
sha2 = "0.10"
trash = "3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
# Ottimizzazione per dimensione ed esecuzione rapida con LTO parallela (Thin LTO)
opt-level = "s"
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true
