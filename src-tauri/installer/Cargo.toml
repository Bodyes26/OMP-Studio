[package]
name = "omp-studio-setup"
version = "0.0.0"
description = "Installer grafico Windows di OMP Studio: contiene il setup NSIS di Tauri"
edition = "2021"
publish = false

# Il setup NSIS da incorporare arriva da OMP_INSTALLER_PAYLOAD (vedi build.rs e
# scripts/build-windows-installer.mjs). La versione mostrata e' quella di
# package.json, letta da tauri.conf.json.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
semver = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Environment",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }
