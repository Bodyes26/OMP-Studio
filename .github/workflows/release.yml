name: Release multipiattaforma

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da compilare o pubblicare (es. v1.2.0 o v1.2.0-rc.1)"
        required: true
        type: string
      from_candidate:
        description: "Tag della Release Candidate sorgente da cui promuovere gli artefatti (es. v1.2.0-rc.1). Se vuoto, cerca candidati idonei o compila da zero."
        required: false
        default: ""
        type: string
      force_rebuild:
        description: "Forza la ricompilazione da zero anche se esiste una Release Candidate"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  resolve:
    name: Verifica consistenza e risoluzione candidate
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.check.outputs.release_tag }}
      is_candidate: ${{ steps.check.outputs.is_candidate }}
      promote: ${{ steps.check.outputs.promote }}
      candidate_tag: ${{ steps.check.outputs.candidate_tag }}
      target_sha: ${{ steps.check.outputs.target_sha }}
    steps:
      - name: Checkout del tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Installa Bun
        uses: oven-sh/setup-bun@v2

      - name: Verifica allineamento versioni
        run: node scripts/release.mjs --check

      - name: Smoke test delle funzionalita critiche
        run: npm run test:smoke
      - name: Analisi tag e verifica consistenza candidate
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FORCE_REBUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.force_rebuild || 'false' }}
          FROM_CANDIDATE: ${{ github.event_name == 'workflow_dispatch' && inputs.from_candidate || '' }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="${RELEASE_TAG}"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

          # Determina se il tag corrente è esso stesso un pre-release/candidate (es. v1.2.0-rc.1)
          if [[ "$RELEASE_TAG" =~ - ]]; then
            echo "Il tag $RELEASE_TAG è una versione pre-release / candidate."
            echo "is_candidate=true" >> "$GITHUB_OUTPUT"
            echo "promote=false" >> "$GITHUB_OUTPUT"
            echo "candidate_tag=" >> "$GITHUB_OUTPUT"
            TARGET_SHA=$(git rev-parse "${RELEASE_TAG}^{commit}")
            echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          else
            echo "is_candidate=false" >> "$GITHUB_OUTPUT"
          fi

          TARGET_SHA=$(git rev-parse "${RELEASE_TAG}^{commit}")
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "Commit del tag $RELEASE_TAG: $TARGET_SHA"

          # Se è richiesto esplicitamente il rebuild forzato, compila da zero
          if [ "$FORCE_REBUILD" = "true" ]; then
            echo "Richiesta ricompilazione forzata (force_rebuild=true). Skip promozione candidate."
            echo "promote=false" >> "$GITHUB_OUTPUT"
            echo "candidate_tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Risolvi eventuale tag candidate sorgente
          CANDIDATE_TAG="$FROM_CANDIDATE"
          if [ -z "$CANDIDATE_TAG" ]; then
            echo "Nessuna candidate specificata manualmente. Ricerca candidate esistente per $RELEASE_TAG..."
            MATCHED_TAG=$(git tag -l "${RELEASE_TAG}-rc*" "${RELEASE_TAG}-beta*" | sort -V | tail -n1 || true)
            if [ -n "$MATCHED_TAG" ]; then
              CANDIDATE_TAG="$MATCHED_TAG"
              echo "Trovato tag candidate: $CANDIDATE_TAG"
            else
              GH_CAND=$(gh release list --limit 30 --json tagName,isPrerelease --jq ".[] | select(.isPrerelease and (.tagName | startswith(\"${RELEASE_TAG}-\"))) | .tagName" 2>/dev/null | head -n1 || true)
              if [ -n "$GH_CAND" ]; then
                CANDIDATE_TAG="$GH_CAND"
                echo "Trovata release candidate su GitHub: $CANDIDATE_TAG"
              fi
            fi
          fi

          if [ -z "$CANDIDATE_TAG" ]; then
            echo "Nessuna Release Candidate trovata per $RELEASE_TAG. Procedura con compilazione standard."
            echo "promote=false" >> "$GITHUB_OUTPUT"
            echo "candidate_tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Verifica se la release candidate esiste su GitHub e ha una release associata
          if ! gh release view "$CANDIDATE_TAG" >/dev/null 2>&1; then
            echo "Attenzione: la candidate $CANDIDATE_TAG non ha una release GitHub associata. Procedura con compilazione standard."
            echo "promote=false" >> "$GITHUB_OUTPUT"
            echo "candidate_tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # --- VERIFICA DI CONSISTENZA DEL COMMIT ---
          echo "Verifica consistenza commit tra tag stabile $RELEASE_TAG e candidate $CANDIDATE_TAG..."
          CANDIDATE_SHA=$(git rev-parse "${CANDIDATE_TAG}^{commit}" 2>/dev/null || gh release view "$CANDIDATE_TAG" --json targetCommitish --jq .targetCommitish)

          echo "Target commit:    $TARGET_SHA ($RELEASE_TAG)"
          echo "Candidate commit: $CANDIDATE_SHA ($CANDIDATE_TAG)"

          if [ "$TARGET_SHA" != "$CANDIDATE_SHA" ]; then
            echo "::error::INCONSISTENZA BLOCCANTE: Il tag stabile $RELEASE_TAG punta a $TARGET_SHA, mentre la candidate $CANDIDATE_TAG punta a $CANDIDATE_SHA."
            echo "::error::Rischio di discrepanza: gli artefatti testati nella candidate non riflettono il codice sorgente del tag stabile!"
            echo "::error::Per compilare forzatamente il nuovo codice, eseguire il workflow con force_rebuild=true, oppure allineare i tag allo stesso commit testato."
            exit 1
          fi

          echo "Consistenza verificata con successo: sia $RELEASE_TAG che $CANDIDATE_TAG puntano esattamente allo stesso commit ($TARGET_SHA)."
          echo "Gli artefatti firmati e testati della candidate $CANDIDATE_TAG verranno riutilizzati per la release stabile."
          echo "promote=true" >> "$GITHUB_OUTPUT"
          echo "candidate_tag=$CANDIDATE_TAG" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: resolve
    if: needs.resolve.outputs.promote != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            build_args: --bundles nsis
            artifact_name: windows-x64
            artifact_path: src-tauri/target/release/bundle/nsis/*.exe
          - name: macOS universal
            os: macos-14
            build_args: --bundles dmg --target universal-apple-darwin
            artifact_name: macos-universal
            artifact_path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout del tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.release_tag }}

      - name: Installa Bun
        uses: oven-sh/setup-bun@v2

      - name: Installa Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Installa i target macOS universal
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Installa le dipendenze
        run: bun install --frozen-lockfile

      - name: Compila gli installer
        run: bun tauri build ${{ matrix.build_args }}

      - name: Conserva gli installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  promote:
    name: Promuovi artefatti da candidate
    needs: resolve
    if: needs.resolve.outputs.promote == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.release_tag }}

      - name: Scarica asset della candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CANDIDATE_TAG: ${{ needs.resolve.outputs.candidate_tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate-assets promoted-assets
          gh release download "$CANDIDATE_TAG" --dir candidate-assets
          echo "Asset scaricati da $CANDIDATE_TAG:"
          ls -la candidate-assets

      - name: Prepara e valida asset promossi
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          CANDIDATE_TAG: ${{ needs.resolve.outputs.candidate_tag }}
        shell: bash
        run: |
          set -euo pipefail
          TARGET_VERSION="${RELEASE_TAG#v}"
          CANDIDATE_VERSION="${CANDIDATE_TAG#v}"

          for file in candidate-assets/*; do
            [ -f "$file" ] || continue
            fname=$(basename "$file")
            # Ignora manifest o checksum vecchi che verranno rigenerati
            if [[ "$fname" == "SHA256SUMS.txt" || "$fname" == *.json ]]; then
              continue
            fi

            # Rinomina la stringa di versione se presente nel nome file (es. OMP.Studio_1.2.0-rc.1_... -> OMP.Studio_1.2.0_...)
            new_fname="${fname/$CANDIDATE_VERSION/$TARGET_VERSION}"
            cp "$file" "promoted-assets/$new_fname"
            if [ "$new_fname" != "$fname" ]; then
              echo "Promosso: $fname -> $new_fname"
            else
              echo "Promosso: $fname"
            fi
          done

          # Verifica presenza degli installer attesi
          has_exe=false
          has_dmg=false
          for f in promoted-assets/*; do
            [[ "$f" == *.exe ]] && has_exe=true
            [[ "$f" == *.dmg ]] && has_dmg=true
          done

          if [ "$has_exe" = "false" ] || [ "$has_dmg" = "false" ]; then
            echo "::error::Artefatti incompleti nella candidate: attesi sia installer Windows (.exe) che macOS (.dmg)."
            exit 1
          fi

          # Calcola i checksum SHA256 dei file promossi
          (cd promoted-assets && sha256sum * > SHA256SUMS.txt)
          echo "Checksum SHA256 calcolati per la release stabile:"
          cat promoted-assets/SHA256SUMS.txt

      - name: Conserva gli installer promossi
        uses: actions/upload-artifact@v4
        with:
          name: promoted-assets
          path: promoted-assets/*
          if-no-files-found: error

  publish:
    name: Pubblica release
    needs: [resolve, build, promote]
    if: always() && !cancelled() && needs.resolve.result == 'success' && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.release_tag }}
          fetch-depth: 0

      - name: Installa Bun
        uses: oven-sh/setup-bun@v2

      - name: Scarica tutti gli installer
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Prepara note di release
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          PROMOTE: ${{ needs.resolve.outputs.promote }}
          CANDIDATE_TAG: ${{ needs.resolve.outputs.candidate_tag }}
          TARGET_SHA: ${{ needs.resolve.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${RELEASE_TAG#v}"

          # 1. Tenta di estrarre le note dall'annotazione del git tag
          TAG_ANNOTATION=$(git tag -l --format='%(contents)' "$RELEASE_TAG" 2>/dev/null || true)
          if [ -n "$(echo "$TAG_ANNOTATION" | tr -d '[:space:]')" ]; then
            echo "$TAG_ANNOTATION" > release-notes.md
          # 2. Fallback su CHANGELOG.md tramite scripts/release.mjs --notes
          elif node scripts/release.mjs --notes "$TAG_VERSION" > release-notes.md 2>/dev/null; then
            :
          else
            echo "Release $RELEASE_TAG" > release-notes.md
          fi

          # Se la release e' stata promossa da una RC, aggiungi nota di attestazione in calce
          if [ "$PROMOTE" = "true" ]; then
            {
              echo ""
              echo "---"
              echo "*(Artefatti verificati e promossi dalla Release Candidate \`$CANDIDATE_TAG\` sul commit \`${TARGET_SHA:0:7}\` senza ricompilazione)*"
            } >> release-notes.md
          fi

          echo "=== NOTE DI RELEASE ==="
          cat release-notes.md

      - name: Crea o completa la release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          IS_CANDIDATE: ${{ needs.resolve.outputs.is_candidate }}
        shell: bash
        run: |
          set -euo pipefail
          EXTRA_FLAGS=()
          if [ "$IS_CANDIDATE" = "true" ]; then
            EXTRA_FLAGS+=("--prerelease")
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --notes-file release-notes.md "${EXTRA_FLAGS[@]}"
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --notes-file release-notes.md \
              "${EXTRA_FLAGS[@]}"
          fi
