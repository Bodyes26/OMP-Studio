name: Release multipiattaforma

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da compilare o pubblicare (es. v1.2.0 o v1.2.0-rc.1)"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  resolve:
    name: Verifica consistenza tag di release
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.check.outputs.release_tag }}
      is_candidate: ${{ steps.check.outputs.is_candidate }}
      target_sha: ${{ steps.check.outputs.target_sha }}
    steps:
      - name: Checkout del tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Installa Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4
        with:
          node-version: 22

      - name: Installa Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Analisi tag e verifica versione
        id: check
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="${RELEASE_TAG}"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

          # Determina se il tag corrente è una pre-release / candidate (es. v1.2.0-rc.1)
          if [[ "$RELEASE_TAG" =~ - ]]; then
            echo "Il tag $RELEASE_TAG è una versione pre-release / candidate."
            echo "is_candidate=true" >> "$GITHUB_OUTPUT"
          else
            echo "Il tag $RELEASE_TAG è una release stabile."
            echo "is_candidate=false" >> "$GITHUB_OUTPUT"
          fi

          TARGET_SHA=$(git rev-parse "${RELEASE_TAG}^{commit}")
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "Commit del tag $RELEASE_TAG: $TARGET_SHA"

  gate:
    name: Gate di qualita
    needs: resolve
    uses: ./.github/workflows/gate.yml
    with:
      ref: ${{ needs.resolve.outputs.release_tag }}

  build:
    name: Build ${{ matrix.name }}
    needs: [resolve, gate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            build_args: --bundles nsis
            artifact_name: windows-x64
            artifact_glob: src-tauri/target/release/bundle/nsis/*.exe
          - name: macOS universal
            os: macos-14
            build_args: --bundles dmg --target universal-apple-darwin
            artifact_name: macos-universal
            artifact_glob: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Linux x64
            os: ubuntu-22.04
            build_args: --bundles deb,appimage
            artifact_name: linux-x64
            artifact_glob: "src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/bundle/appimage/*.AppImage"
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout del tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.release_tag }}

      - name: Installa Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4
        with:
          node-version: 22

      - name: Installa Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Installa Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # branch stable, 2026-08-05
        with:
          toolchain: stable
          components: clippy

      - name: Installa dipendenze di sistema Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Installa i target macOS universal
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache delle dipendenze Rust
        uses: swatinem/rust-cache@82a92a6e8fbeee08c6c4d4b1204d5517777f43f1 # v2
        with:
          workspaces: "src-tauri -> target"

      - name: Installa le dipendenze
        run: bun install --frozen-lockfile

      - name: Test del backend Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Lint del backend Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Compila gli installer
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
          CI: "true"
        run: bun tauri build ${{ matrix.build_args }}

      - name: Verifica firma e notarizzazione macOS (fail-closed per release stabile)
        if: runner.os == 'macOS'
        shell: bash
        env:
          SIGNING_CONFIGURED: ${{ secrets.APPLE_CERTIFICATE != '' && 'true' || 'false' }}
          IS_CANDIDATE: ${{ needs.resolve.outputs.is_candidate }}
        run: |
          set -euo pipefail
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/OMP Studio.app"
          if [ "$SIGNING_CONFIGURED" != "true" ]; then
            if [ "$IS_CANDIDATE" = "true" ]; then
              echo "::warning::Candidate senza certificato Apple: il bundle non e' firmato ne' notarizzato."
              exit 0
            fi
            echo "::error::Release stabile senza certificato Apple: configura i secret APPLE_* prima di pubblicare."
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --type execute --verbose=4 "$APP"
          xcrun stapler validate "$APP"

      - name: Firma Authenticode dei binari ed installer Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_THUMBPRINT)) {
            Write-Output "Nessun certificato Windows configurato (WINDOWS_CERTIFICATE_THUMBPRINT non presente)."
          } else {
            Write-Output "Firma Authenticode con impronta: $env:WINDOWS_CERTIFICATE_THUMBPRINT"
            # Firma eseguibili in target/release
            $binaries = Get-ChildItem -Path 'src-tauri/target/release' -Filter '*.exe' -File | Where-Object { $_.Name -notmatch 'build_script|deps' }
            foreach ($bin in $binaries) {
              & powershell -NoProfile -ExecutionPolicy Bypass -File scripts/sign-windows.ps1 -Path $bin.FullName
            }
            # Firma installer NSIS
            $installers = Get-ChildItem -Path 'src-tauri/target/release/bundle/nsis/*.exe' -File
            foreach ($inst in $installers) {
              & powershell -NoProfile -ExecutionPolicy Bypass -File scripts/sign-windows.ps1 -Path $inst.FullName
            }
          }

      - name: Verifica firma Authenticode Windows (fail-closed per release stabile)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SIGNING_CONFIGURED: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT != '' && 'true' || 'false' }}
          IS_CANDIDATE: ${{ needs.resolve.outputs.is_candidate }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SIGNING_CONFIGURED -ne 'true') {
            if ($env:IS_CANDIDATE -eq 'true') {
              Write-Output "::warning::Candidate senza certificato di code signing: i binari Windows non sono firmati."
              exit 0
            }
            Write-Output "::error::Release stabile senza certificato di code signing: configura WINDOWS_CERTIFICATE_THUMBPRINT prima di pubblicare."
            exit 1
          }
          # 1. Verifica eseguibile principale dell'applicazione
          $binaries = Get-ChildItem -Path 'src-tauri/target/release' -Filter '*.exe' -File | Where-Object { $_.Name -notmatch 'build_script|deps' }
          foreach ($bin in $binaries) {
            $binSig = Get-AuthenticodeSignature -LiteralPath $bin.FullName
            Write-Output "Firma del binario $($bin.Name): $($binSig.Status)"
            if ($binSig.Status -ne 'Valid') {
              Write-Output "::error::Binario $($bin.Name) non firmato correttamente: $($binSig.StatusMessage)"
              exit 1
            }
          }

          # 2. Verifica installer NSIS
          $installers = Get-ChildItem -Path 'src-tauri/target/release/bundle/nsis/*.exe'
          if (-not $installers) {
            Write-Output "::error::Nessun installer NSIS trovato in src-tauri/target/release/bundle/nsis/"
            exit 1
          }
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
            Write-Output "Firma di $($installer.Name): $($signature.Status)"
            if ($signature.Status -ne 'Valid') {
              Write-Output "::error::Installer $($installer.Name) non firmato correttamente: $($signature.StatusMessage)"
              exit 1
            }
          }

      - name: Prepara staging piatto con nomi normalizzati a punti
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging
          for pattern in ${{ matrix.artifact_glob }}; do
            for f in $pattern; do
              [ -f "$f" ] || continue
              fname=$(basename "$f")
              dotted="${fname// /.}"
              cp -f "$f" "staging/$dotted"
              echo "Staging: $fname -> $dotted"
            done
          done
          echo "Artefatti in staging:"
          ls -la staging

      - name: Conserva gli installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact_name }}
          path: staging/*
          if-no-files-found: error

  publish:
    name: Pubblica release
    needs: [resolve, gate, build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.release_tag }}
          fetch-depth: 0

      - name: Installa Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4
        with:
          node-version: 22

      - name: Installa Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Scarica tutti gli installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Prepara note di release e checksum piatti
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          TARGET_SHA: ${{ needs.resolve.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${RELEASE_TAG#v}"

          # Appiattisce release-assets
          find release-assets -mindepth 2 -type f -exec mv -t release-assets {} +
          find release-assets -mindepth 1 -type d -empty -delete || true

          # Normalizza a punti eventuali file rimanenti con spazi
          for f in release-assets/*; do
            [ -f "$f" ] || continue
            fname=$(basename "$f")
            dotted="${fname// /.}"
            if [ "$fname" != "$dotted" ]; then
              mv -f "$f" "release-assets/$dotted"
            fi
          done

          # 1. Tenta di estrarre le note dall'annotazione del git tag
          TAG_ANNOTATION=$(git tag -l --format='%(contents)' "$RELEASE_TAG" 2>/dev/null || true)
          if [ -n "$(echo "$TAG_ANNOTATION" | tr -d '[:space:]')" ]; then
            echo "$TAG_ANNOTATION" > release-notes.md
          # 2. Fallback su CHANGELOG.md tramite scripts/release.mjs --notes
          elif node scripts/release.mjs --notes "$TAG_VERSION" > release-notes.md 2>/dev/null; then
            :
          else
            echo "Release $RELEASE_TAG" > release-notes.md
          fi

          # Rigenera la tabella dei checksum SHA256 dei soli file regolari pubblicati
          (cd release-assets && rm -f SHA256SUMS.txt && find . -maxdepth 1 -type f -exec sha256sum {} + | sed 's|^\./||' | sort -k2 > SHA256SUMS.txt)
          echo "=== CHECKSUM RELEASE ==="
          cat release-assets/SHA256SUMS.txt

          echo "=== NOTE DI RELEASE ==="
          cat release-notes.md

      - name: Crea o completa la release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          IS_CANDIDATE: ${{ needs.resolve.outputs.is_candidate }}
        shell: bash
        run: |
          set -euo pipefail
          EXTRA_FLAGS=()
          if [ "$IS_CANDIDATE" = "true" ]; then
            EXTRA_FLAGS+=("--prerelease")
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --notes-file release-notes.md "${EXTRA_FLAGS[@]}"
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --notes-file release-notes.md \
              "${EXTRA_FLAGS[@]}"
          fi
