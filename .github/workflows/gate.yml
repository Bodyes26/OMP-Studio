name: Gate di qualita

# Gate unico riusato da Nightly e Release: nessun installer viene compilato o
# promosso se uno di questi controlli fallisce. I gate Rust girano dentro i job
# di build, sulla stessa macchina che produce l'artefatto.

on:
  workflow_call:
    inputs:
      ref:
        description: "Ref da verificare (tag, branch o commit)"
        required: false
        default: ""
        type: string

jobs:
  gate:
    name: Tipi, test, dipendenze e igiene del diff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}
          fetch-depth: 2

      - name: Installa Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Installa Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Installa le dipendenze
        run: bun install --frozen-lockfile

      - name: Allineamento dei quattro file di versione
        run: node scripts/release.mjs --check

      # Preparazione unica (Paraglide + SvelteKit sync), come il preflight
      # locale `npm run verify:nightly`. Prima la compilavano tre volte:
      # lo step i18n, `bun run check` e il runner degli smoke test.
      - name: Prepara il frontend
        run: node scripts/prepare-frontend.mjs

      - name: Tipi del frontend
        run: node node_modules/svelte-check/bin/svelte-check --tsconfig ./tsconfig.json

      - name: Smoke test delle funzionalita critiche
        run: node scripts/run-smoke-tests.mjs --prepared

      # GHSA-gcqx-w48m-w2h4 (deepmerge, bassa): arriva solo da @sveltejs/vite-plugin-svelte
      # in fase di build e non esiste una versione corretta (4.3.1 e' l'ultima, 2026-11-05).
      # Toglierlo quando deepmerge o il plugin pubblicano una correzione.
      # GHSA-fc5q-39xc-vjpf (picomatch <=4.0.7, ReDoS, alta): pubblicata il 2026-10-19,
      # nessuna versione corretta (4.0.7 e' l'ultima). Arriva solo da vite, svelte-check e
      # unplugin di Paraglide in fase di build, con glob scritti da noi e mai dall'utente;
      # non finisce nel bundle. Toglierlo quando picomatch pubblica una correzione.
      - name: Vulnerabilita delle dipendenze
        run: bun audit --ignore=GHSA-gcqx-w48m-w2h4 --ignore=GHSA-fc5q-39xc-vjpf

      - name: Igiene del diff dell'ultimo commit
        run: git diff --check HEAD^ HEAD
