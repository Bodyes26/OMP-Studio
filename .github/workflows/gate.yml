name: Gate di qualita

# Gate unico riusato da Nightly e Release: nessun installer viene compilato o
# promosso se uno di questi controlli fallisce. I gate Rust girano dentro i job
# di build, sulla stessa macchina che produce l'artefatto.

on:
  workflow_call:
    inputs:
      ref:
        description: "Ref da verificare (tag, branch o commit)"
        required: false
        default: ""
        type: string

jobs:
  gate:
    name: Tipi, test, dipendenze e igiene del diff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}
          fetch-depth: 2

      - name: Installa Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Installa Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Installa le dipendenze
        run: bun install --frozen-lockfile

      - name: Allineamento dei quattro file di versione
        run: node scripts/release.mjs --check

      - name: Compila dizionari i18n
        run: node node_modules/@inlang/paraglide-js/bin/run.js compile --project ./project.inlang --outdir ./src/lib/paraglide --strategy baseLocale --emit-ts-declarations --disable-async-local-storage

      - name: Tipi del frontend
        run: bun run check

      - name: Smoke test delle funzionalita critiche
        run: npm run test:smoke

      - name: Vulnerabilita delle dipendenze
        run: bun audit

      - name: Igiene del diff dell'ultimo commit
        run: git diff --check HEAD^ HEAD
