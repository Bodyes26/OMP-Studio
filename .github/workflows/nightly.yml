name: Nightly multipiattaforma

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  gate:
    name: Gate di qualita
    uses: ./.github/workflows/gate.yml

  build:
    name: Build ${{ matrix.name }}
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            build_args: --bundles nsis
            artifact_name: nightly-windows-x64
            artifact_path: src-tauri/target/release/bundle/nsis/*.exe
          - name: macOS universal
            os: macos-14
            build_args: --bundles dmg --target universal-apple-darwin
            artifact_name: nightly-macos-universal
            artifact_path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout del commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Imposta la versione nightly temporanea
        shell: bash
        run: node scripts/nightly-version.mjs "$(date -d "${{ github.run_started_at }}" +%s)"

      - name: Installa Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Installa Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # branch stable, 2026-08-05
        with:
          toolchain: stable
          components: clippy

      - name: Installa i target macOS universal
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache delle dipendenze Rust
        uses: swatinem/rust-cache@82a92a6e8fbeee08c6c4d4b1204d5517777f43f1 # v2
        with:
          workspaces: "src-tauri -> target"

      - name: Installa le dipendenze
        run: bun install --frozen-lockfile

      - name: Test del backend Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Lint del backend Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Compila gli installer
        run: bun tauri build ${{ matrix.build_args }}

      - name: Conserva gli installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  publish:
    name: Aggiorna il canale nightly
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout del commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Calcola la versione nightly
        id: nightly
        shell: bash
        run: echo "version=$(node scripts/nightly-version.mjs "$(date -d "${{ github.run_started_at }}" +%s)")" >> "$GITHUB_OUTPUT"

      - name: Scarica tutti gli installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Prepara manifest e note
        env:
          NIGHTLY_VERSION: ${{ steps.nightly.outputs.version }}
        shell: bash
        run: |
          jq -n \
            --arg version "$NIGHTLY_VERSION" \
            --arg commit "$GITHUB_SHA" \
            --arg published_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version: $version, commit: $commit, published_at: $published_at}' \
            > nightly.json
          printf 'Build automatica del commit `%s` sul ramo `main`.\n\nQuesta versione può contenere modifiche non ancora verificate per il canale stabile.\n' \
            "$GITHUB_SHA" > nightly-notes.md

      - name: Pubblica o aggiorna la prerelease nightly
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NIGHTLY_VERSION: ${{ steps.nightly.outputs.version }}
        shell: bash
        run: |
          git tag -f nightly "$GITHUB_SHA"
          git push origin refs/tags/nightly --force

          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly \
              --title "Nightly $NIGHTLY_VERSION" \
              --notes-file nightly-notes.md \
              --prerelease
            gh release upload nightly release-assets/* nightly.json --clobber
          else
            gh release create nightly release-assets/* nightly.json \
              --verify-tag \
              --prerelease \
              --title "Nightly $NIGHTLY_VERSION" \
              --notes-file nightly-notes.md
          fi
