name: Nightly multipiattaforma

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "src-tauri/**"
      - "static/**"
      - "package.json"
      - "bun.lock"
      - "scripts/nightly-version.mjs"
      - ".github/workflows/nightly.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            build_args: --bundles nsis
            artifact_name: nightly-windows-x64
            artifact_path: src-tauri/target/release/bundle/nsis/*.exe
          - name: macOS universal
            os: macos-14
            build_args: --bundles dmg --target universal-apple-darwin
            artifact_name: nightly-macos-universal
            artifact_path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout del commit
        uses: actions/checkout@v4

      - name: Imposta la versione nightly temporanea
        shell: bash
        run: node scripts/nightly-version.mjs "${{ github.run_id }}"

      - name: Installa Bun
        uses: oven-sh/setup-bun@v2

      - name: Installa Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Installa i target macOS universal
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Installa le dipendenze
        run: bun install --frozen-lockfile

      - name: Compila gli installer
        run: bun tauri build ${{ matrix.build_args }}

      - name: Conserva gli installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  publish:
    name: Aggiorna il canale nightly
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calcola la versione nightly
        id: nightly
        shell: bash
        run: echo "version=$(node scripts/nightly-version.mjs '${{ github.run_id }}')" >> "$GITHUB_OUTPUT"

      - name: Scarica tutti gli installer
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Prepara manifest e note
        env:
          NIGHTLY_VERSION: ${{ steps.nightly.outputs.version }}
        shell: bash
        run: |
          jq -n \
            --arg version "$NIGHTLY_VERSION" \
            --arg commit "$GITHUB_SHA" \
            --arg published_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version: $version, commit: $commit, published_at: $published_at}' \
            > nightly.json
          printf 'Build automatica del commit `%s` sul ramo `main`.\n\nQuesta versione può contenere modifiche non ancora verificate per il canale stabile.\n' \
            "$GITHUB_SHA" > nightly-notes.md

      - name: Sostituisce la prerelease nightly
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NIGHTLY_VERSION: ${{ steps.nightly.outputs.version }}
        shell: bash
        run: |
          if gh release view nightly >/dev/null 2>&1; then
            gh release delete nightly --yes
          fi
          git tag -f nightly "$GITHUB_SHA"
          git push origin refs/tags/nightly --force
          gh release create nightly release-assets/* nightly.json \
            --verify-tag \
            --prerelease \
            --title "Nightly $NIGHTLY_VERSION" \
            --notes-file nightly-notes.md
